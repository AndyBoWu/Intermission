<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Intermission single-display overlay preview</title>
  <desc id="desc">A calm dark break surface with a circular countdown, eye-rest guidance, progress line, and visible end-break control.</desc>
  <rect width="1600" height="900" fill="#0d1016"/>
  <rect x="0" y="0" width="1600" height="44" fill="#151a22"/>
  <circle cx="30" cy="22" r="6" fill="#8aa2c8"/>
  <rect x="48" y="17" width="84" height="10" rx="5" fill="#2b3442"/>
  <rect x="1428" y="17" width="52" height="10" rx="5" fill="#2b3442"/>
  <rect x="1492" y="17" width="76" height="10" rx="5" fill="#2b3442"/>

  <text x="54" y="98" fill="#f4f6fb" font-family="Inter, system-ui, sans-serif" font-size="24" letter-spacing="0.5">Intermission</text>

  <circle cx="800" cy="340" r="204" fill="none" stroke="#303948" stroke-width="2"/>
  <circle cx="800" cy="340" r="160" fill="none" stroke="#8aa2c8" stroke-width="3" stroke-dasharray="812 194" stroke-linecap="round" transform="rotate(-90 800 340)"/>
  <text x="800" y="276" fill="#dce4f0" font-family="Inter, system-ui, sans-serif" font-size="20" letter-spacing="3" text-anchor="middle">SHORT INTERMISSION</text>
  <text x="800" y="372" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="104" font-weight="500" text-anchor="middle">0:17</text>
  <text x="800" y="420" fill="#eef2f8" font-family="Inter, system-ui, sans-serif" font-size="30" text-anchor="middle">A moment for your eyes</text>

  <text x="800" y="630" fill="#f4f6fb" font-family="Inter, system-ui, sans-serif" font-size="34" text-anchor="middle">Look across the room and let your focus soften.</text>
  <rect x="430" y="675" width="740" height="6" rx="3" fill="#303948"/>
  <rect x="430" y="675" width="630" height="6" rx="3" fill="#8aa2c8"/>

  <rect x="692" y="722" width="216" height="60" rx="14" fill="#171d27" stroke="#8aa2c8" stroke-width="2"/>
  <text x="800" y="760" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="21" text-anchor="middle">End break</text>
  <text x="800" y="824" fill="#dce4f0" font-family="Inter, system-ui, sans-serif" font-size="18" text-anchor="middle">Enter to finish · Hold Esc for 3 seconds to exit</text>
</svg>
