<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Intermission two-display overlay preview</title>
  <desc id="desc">Two displays show the same break surface while the focused display owns the highlighted action.</desc>
  <rect width="1600" height="900" fill="#090c11"/>
  <text x="80" y="68" fill="#f4f6fb" font-family="Inter, system-ui, sans-serif" font-size="28">Intermission · multi-display preview</text>

  <g transform="translate(70 112)">
    <rect width="700" height="650" rx="24" fill="#0d1016" stroke="#8aa2c8" stroke-width="4"/>
    <rect width="700" height="34" rx="24" fill="#151a22"/>
    <rect y="20" width="700" height="14" fill="#151a22"/>
    <circle cx="28" cy="17" r="5" fill="#8aa2c8"/>
    <text x="28" y="76" fill="#f4f6fb" font-family="Inter, system-ui, sans-serif" font-size="18">Intermission</text>
    <circle cx="350" cy="260" r="132" fill="none" stroke="#303948" stroke-width="2"/>
    <circle cx="350" cy="260" r="105" fill="none" stroke="#8aa2c8" stroke-width="3" stroke-dasharray="520 140" stroke-linecap="round" transform="rotate(-90 350 260)"/>
    <text x="350" y="222" fill="#dce4f0" font-family="Inter, system-ui, sans-serif" font-size="13" letter-spacing="2" text-anchor="middle">SHORT INTERMISSION</text>
    <text x="350" y="284" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="64" text-anchor="middle">0:17</text>
    <text x="350" y="320" fill="#eef2f8" font-family="Inter, system-ui, sans-serif" font-size="20" text-anchor="middle">A moment for your eyes</text>
    <text x="350" y="470" fill="#f4f6fb" font-family="Inter, system-ui, sans-serif" font-size="19" text-anchor="middle">Look across the room and let your focus soften.</text>
    <rect x="120" y="500" width="460" height="5" rx="3" fill="#303948"/>
    <rect x="120" y="500" width="390" height="5" rx="3" fill="#8aa2c8"/>
    <rect x="268" y="532" width="164" height="48" rx="12" fill="#171d27" stroke="#8aa2c8" stroke-width="3"/>
    <text x="350" y="562" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" text-anchor="middle">End break</text>
    <text x="350" y="620" fill="#8aa2c8" font-family="Inter, system-ui, sans-serif" font-size="15" text-anchor="middle">Focused display · keyboard active</text>
  </g>

  <g transform="translate(830 112)">
    <rect width="700" height="650" rx="24" fill="#0d1016" stroke="#303948" stroke-width="3"/>
    <rect width="700" height="34" rx="24" fill="#151a22"/>
    <rect y="20" width="700" height="14" fill="#151a22"/>
    <circle cx="28" cy="17" r="5" fill="#62738d"/>
    <text x="28" y="76" fill="#f4f6fb" font-family="Inter, system-ui, sans-serif" font-size="18">Intermission</text>
    <circle cx="350" cy="260" r="132" fill="none" stroke="#303948" stroke-width="2"/>
    <circle cx="350" cy="260" r="105" fill="none" stroke="#8aa2c8" stroke-width="3" stroke-dasharray="520 140" stroke-linecap="round" transform="rotate(-90 350 260)"/>
    <text x="350" y="222" fill="#dce4f0" font-family="Inter, system-ui, sans-serif" font-size="13" letter-spacing="2" text-anchor="middle">SHORT INTERMISSION</text>
    <text x="350" y="284" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="64" text-anchor="middle">0:17</text>
    <text x="350" y="320" fill="#eef2f8" font-family="Inter, system-ui, sans-serif" font-size="20" text-anchor="middle">A moment for your eyes</text>
    <text x="350" y="470" fill="#f4f6fb" font-family="Inter, system-ui, sans-serif" font-size="19" text-anchor="middle">Look across the room and let your focus soften.</text>
    <rect x="120" y="500" width="460" height="5" rx="3" fill="#303948"/>
    <rect x="120" y="500" width="390" height="5" rx="3" fill="#8aa2c8"/>
    <rect x="268" y="532" width="164" height="48" rx="12" fill="#171d27" stroke="#4a5668" stroke-width="2"/>
    <text x="350" y="562" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" text-anchor="middle">End break</text>
    <text x="350" y="620" fill="#aeb9c8" font-family="Inter, system-ui, sans-serif" font-size="15" text-anchor="middle">Mirrored surface · pointer active</text>
  </g>

  <rect x="300" y="793" width="240" height="16" rx="8" fill="#222a36"/>
  <rect x="1060" y="793" width="240" height="16" rx="8" fill="#222a36"/>
  <rect x="365" y="809" width="110" height="20" rx="4" fill="#161c25"/>
  <rect x="1125" y="809" width="110" height="20" rx="4" fill="#161c25"/>
</svg>
